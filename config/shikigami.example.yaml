# A complete Shikigami configuration file.
#
# Pass it to any binary with --config, one or more times:
#
#   shikigami-worker --config config/shikigami.example.yaml
#   shikigami-server --check-config --config config/shikigami.example.yaml
#
# Every key below is optional except database.connection_string, which the
# worker roles refuse to start without. Omitting a key leaves its declared
# default in place; run `shikigami-worker --describe-config` for the full
# schema, or see docs/operations/configuration.md.
#
# Unknown keys are rejected rather than ignored, so a typo here fails the
# process with exit code 4 rather than silently doing nothing.
#
# The values shown are the declared defaults, so this file as written changes
# nothing except the connection string.

database:
  # Secret. Redacted in --explain-config and in every error message.
  # Also bound to PG_CONNECTION_STRING, which the Nix dev shell exports.
  connection_string: postgresql:///shikigami

agents:
  # Where the .dhall agent manifests live, relative to the working directory.
  directory: agents

scheduler:
  # What to do about cron minutes that passed while the scheduler was down.
  # skip_missed arms the first tick after now, so a process that wakes a day
  # late enqueues one run. fire_all arms from the tick that just fired, so every
  # missed minute runs — a * * * * * agent offline for a day produces 1440 runs.
  catch_up: skip_missed

worker:
  # Bounds one synchronous provider or program attempt, not the lifetime of a
  # durable workflow. Whole seconds, 1-86400.
  run_timeout_seconds: 300

approval:
  # Bounds ordinary approval waits and flow acknowledgement waits. Whole
  # seconds, 1-86400.
  deadline_seconds: 900

kafka:
  broker: 127.0.0.1:9092
  activity:
    # Consumed by shikigami-consume-stream.
    topic: activity.v1
  events:
    # Consumed by shikigami-consume-events.
    topic: danwa.message-addressed.v1
  groups:
    stream: shikigami-stream
    events: shikigami-events
  dead_letter:
    # Poison records land here before their Kafka offsets can advance.
    queue: shikigami_stream_dead_letters
  # Off is the feedback guard: it stops an agent's own output from triggering
  # it again. Turn it on only for deliberate meta-detectors.
  include_agent_actors: false

http:
  # 127.0.0.1 keeps a development server off the network; "*" binds every
  # interface, which is what a container wants.
  host: 127.0.0.1
  port: 8080

behavior:
  # stub calls no model and answers with a fixed sentence — deterministic, and
  # what every test runs. anthropic calls a real Claude model, and then
  # credentials.providers.anthropic.api_key below becomes required. Whichever is
  # active is announced on stderr at startup and recorded on the kioku session.
  provider: stub
  # Only consulted when provider is anthropic. Must be an id from baikai's
  # catalog; run --describe-config, or set a wrong one, to see the accepted list.
  model: claude-sonnet-4-6

# credentials:
#   providers:
#     anthropic:
#       # Secret, and required only when behavior.provider is anthropic. Prefer a
#       # separate 0600 file passed with a second --config, or the bound
#       # ANTHROPIC_API_KEY variable, over writing it into a checked-in file.
#       api_key: sk-ant-...

sinks:
  kawa:
    base_url: http://localhost:8088
    source_segment: shinzui/shikigami
  kizashi:
    base_url: http://localhost:8089
    default_recipient: recipient:default
  danwa:
    base_url: http://localhost:8080
    agent_participant: part_shikigami
  # rei:
  #   # No default, and commented out on purpose: rei is a CLI application with
  #   # no HTTP server, so there is nothing to point this at yet. While it is
  #   # unset, a ReiAction sink fails into the outbox retry path — visibly, on
  #   # every publisher pass — rather than reporting a delivery that never
  #   # happened. Set it when rei grows an endpoint and the backlog drains.
  #   base_url: http://localhost:8090
